<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine erste Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding-top: 100px;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <h1>👋 Hallo!</h1>

    <p id="text">Das ist meine erste Website.</p>

    <button onclick="changeText()">
        Klick mich!
    </button>

    <script>
        function changeText() {
            document.getElementById("text").innerHTML =
                "🎉 Du hast den Button geklickt!";
        }
    </script>

</body>
</html>
